indexpage:
  title: Astra Control Center 24.02 documentation
  lead: Astra Control Center software provides application-aware data management of Kubernetes clusters in your on-premises environment. Easily back up Kubernetes apps, migrate data to a different cluster, and instantly create working application clones. If you need to manage Kubernetes apps running in a public cloud, go to the docs for Astra Control Service.
  summary: Astra Control Center software provides application-aware data management of Kubernetes clusters in your on-premises environment. Easily back up Kubernetes apps, migrate data to a different cluster, and instantly create working application clones. If you need to manage Kubernetes apps running in a public cloud, go to the docs for Astra Control Service.
